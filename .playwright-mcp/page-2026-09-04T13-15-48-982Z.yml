        - heading "Where does the cost come from?" [level=2] [ref=f16e141]
        - paragraph [ref=f16e142]: "A common misconception in the industry is that the cost of a remake is measured only by re-lab fee as. Yet when a crown is rejected, there are three real cost items behind the loss — and the biggest one comes first:"
        - paragraph [ref=f16e143]: 1. Chair time (the largest line item). Recalling the patient, re-prepping/taking a new impression, and cementing the new work takes 45–75 minutes on average. A clinic's average operating cost per hour ~$375 as modeled; this alone means $280–470.
        - paragraph [ref=f16e144]: 2. Remanufacturing + logistics. The new unit's lab fee, two-way shipping, and any rush (rush) surcharge, if applicable.
        - paragraph [ref=f16e145]: 3. The invisibles. Discounts/favors, wasted appointment slots, material waste, and patient trust erosion.
